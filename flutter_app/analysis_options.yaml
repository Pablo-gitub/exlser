include: package:flutter_lints/flutter.yaml

analyzer:
  # Type strictness the default Flutter set leaves off. These catch real
  # mistakes rather than style: an implicit downcast that can throw at runtime,
  # a generic left as `dynamic`, a raw type hiding an element type.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "ios/**"
    - "**/*.g.dart"

linter:
  rules:
    # Deliberately no formatting-style rules (trailing commas, quote style,
    # import ordering): they would rewrite most of the repository without
    # catching a single bug, and this codebase is not fully formatted with the
    # current dart format to begin with.
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
