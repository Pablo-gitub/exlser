name: CI

# Runs on every push and pull request, so "analyzer clean and tests green"
# is enforced before a branch reaches main instead of by hand.
on:
  push:
    branches-ignore:
      - 'gh-pages'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: 🧪 Analyze & test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Verify formatting of tracked Dart sources
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: flutter_app

      - name: Analyze
        run: flutter analyze
        working-directory: flutter_app

      - name: Test
        run: flutter test
        working-directory: flutter_app

  landing:
    name: 🧱 Build landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing_page/package-lock.json

      - name: Install dependencies
        run: npm --prefix landing_page ci

      - name: Build
        run: npm --prefix landing_page run build

      - name: Audit production dependencies
        run: npm --prefix landing_page audit --omit=dev --audit-level=high
