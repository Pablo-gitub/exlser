name: "Desktop Build & Release"

on:
  push:
    tags:
      - "desktop-v*"
  # Lets the packaging be exercised without publishing anything. The release
  # job below is skipped unless the run came from a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Install project dependencies
        run: flutter pub get
        working-directory: flutter_app
      - name: Build Linux
        run: flutter build linux --release
        working-directory: flutter_app
      - name: Archive Linux Build
        run: zip -r linux-build.zip build/linux/x64/release/bundle/
        working-directory: flutter_app
      - name: Build Debian package
        run: |
          raw="$(grep '^version:' flutter_app/pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          ./packaging/linux/build_deb.sh "${raw%%+*}" \
            flutter_app/build/linux/x64/release/bundle \
            flutter_app/exlser-linux-x86_64.deb
      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            flutter_app/linux-build.zip
            flutter_app/exlser-linux-x86_64.deb

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Install project dependencies
        run: flutter pub get
        working-directory: flutter_app
      - name: Build Windows
        run: flutter build windows --release
        working-directory: flutter_app
      - name: Archive Windows Build
        run: Compress-Archive -Path build/windows/x64/runner/Release -DestinationPath windows-build.zip
        working-directory: flutter_app
      - name: Install pinned Inno Setup
        shell: pwsh
        run: >-
          choco install innosetup --version=6.7.1 --yes --no-progress
          --allow-downgrade
      - name: Build Windows installer
        shell: pwsh
        run: |
          $raw = ((Get-Content flutter_app/pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1) -replace '^version:\s*', '').Trim()
          $appVersion = $raw.Split('+')[0]
          $buildNumber = $raw.Split('+')[1]
          $sourceDir = (Resolve-Path 'flutter_app\build\windows\x64\runner\Release').Path
          $outputDir = (Resolve-Path 'flutter_app').Path
          iscc "/DAppVersion=$appVersion" "/DAppNumericVersion=$appVersion.$buildNumber" `
            "/DSourceDir=$sourceDir" "/O$outputDir" `
            packaging\windows\exlser.iss
          if (-not (Test-Path 'flutter_app\exlser-windows-x64-setup.exe' -PathType Leaf)) {
            throw 'Inno Setup did not produce exlser-windows-x64-setup.exe'
          }
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            flutter_app/windows-build.zip
            flutter_app/exlser-windows-x64-setup.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Install project dependencies
        run: flutter pub get
        working-directory: flutter_app
      - name: Build macOS
        run: flutter build macos --release
        working-directory: flutter_app
      - name: Archive macOS Build
        run: zip -r macos-build.zip build/macos/Build/Products/Release/
        working-directory: flutter_app
      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: flutter_app/macos-build.zip

  release:
    name: Release Desktop Artifacts
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: ./builds/
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./builds/
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./builds/
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./builds/exlser-windows-x64-setup.exe
            ./builds/exlser-linux-x86_64.deb
            ./builds/linux-build.zip
            ./builds/windows-build.zip
            ./builds/macos-build.zip
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
